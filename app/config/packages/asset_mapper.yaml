framework:
    asset_mapper:
        # The paths to make available to the asset mapper.
        paths:
            - assets/
        missing_import_mode: strict

when@prod:
    framework:
        asset_mapper:
            missing_import_mode: warn

# L'environnement de demonstration est un environnement de PRODUCTION : il tourne
# sur un hebergeur, devant un jury. Il reprend donc les memes reglages que prod.
when@demo:
    framework:
        asset_mapper:
            missing_import_mode: warn
