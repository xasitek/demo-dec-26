; Reglages PHP de production pour Synthauto Finance.
expose_php = Off
date.timezone = Europe/Paris

; OPcache : le code ne change qu'au redeploiement, on desactive la revalidation.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 256
opcache.max_accelerated_files = 20000
opcache.interned_strings_buffer = 16

; Cache realpath (perf en prod).
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; Limites de requete (upload import scrap reste petit, mais on garde de la marge).
upload_max_filesize = 16M
post_max_size = 16M
memory_limit = 256M
